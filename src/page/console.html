<!DOCTYPE html>
<!--
  The console page. Rendered by LSConsole2Host.exe and shown in the session's overlay window.
  Talks to the extension and the host through two functions:
    lsc2Send(json)  -> out
    lsc2.rx(msg)     <- in
  In:  reset, lines {lines[]}, focusInput, history {items[] oldest first}, histAdd {c},
       ac {data: any of types, tlos, events, commands, aliases [{n, w}], scripts, files,
       variables [{n, v}]}, members {name, type, members[], methods[]}, paste {text}
  Out: ready, exec {text}, focus, copy {text}, paste, members {name}

  Find (ctrl+F): a bar above the input line; Enter = older match, Shift+Enter = newer, wrapping;
  Alt+C case, Alt+R regex, Alt+W whole word, Alt+F only matching lines; Esc closes.
  Paste (ctrl+V, Shift+Insert): one line only; more is refused with a message (the user's spec).

  Autocomplete (the user's spec, 2026-10-26). "The beginning" of the input is its start, or the
  first token after `relay <where> ` (<where> may be a quoted phrase). Lists:
    - history: a first word (at the beginning) from "hist" to "history"; the words after it filter
      it, all must match, case-insensitive, "quoted words" are one substring;
    - commands, aliases, variables and top-level objects: the first token at the beginning;
    - members after `name.`, methods after `name:` (name a variable or top-level object): at the
      beginning, and inside an unclosed `${`; "name" may be a chain (OgreBotAPI.Bot:, Me.Group[1].);
      the type comes from the extension (${chain(type)});
    - running scripts: after `end ` / `endscript ` at the beginning, and inside `Script[`;
    - script files: after `run ` / `runscript ` at the beginning;
    - types: the <type> of `declare[variable] <varname> <type> <scope> <value>` at the beginning;
    - events: inside `Event[`;
    - top-level objects and variables: inside an unclosed `${`, before any . [ : (
  Ranking: starts with what was typed (same case, then any case), then contains it (same case,
  then any case); then shortest first, then alphabetical.
  Keys: Up/Down move; Tab accepts; Enter accepts unless what's typed already is the highlighted
  entry (then it runs) -- history entries are always accepted, never run. Esc hides the list until
  the input is emptied or Alt+Enter; Esc with no list clears the input line.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: rgba(17, 20, 26, 0.94);
    --edge: #3b4252;
    --fg: #d8dee9;
    --dim: #7b8394;
    --echo: #88c0d0;
    --input-bg: rgba(0, 0, 0, 0.35);
    --sel: rgba(136, 192, 208, 0.35);
    --ac-bg: rgba(8, 10, 14, 0.96);
    --ac-sel: rgba(136, 192, 208, 0.22);
    --mark: #ebcb8b;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #root {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    background: var(--bg); border: 2px solid var(--edge);
    font: 13px/1.35 Consolas, "Cascadia Mono", monospace; color: var(--fg);
  }
  #outwrap { flex: 1; position: relative; min-height: 0; }
  #out { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow-y: auto; padding: 6px 10px;
         white-space: pre-wrap; word-break: break-word; }
  #out .rep { color: var(--dim); margin-left: 8px; -webkit-user-select: none; user-select: none; } /* ×N: a repeated line */
  /* Scrolled up: how many lines arrived since, and the way back down */
  #jump { display: none; position: absolute; right: 16px; bottom: 8px; padding: 3px 10px; border-radius: 10px;
          border: 1px solid var(--edge); background: var(--ac-bg); color: var(--fg); font: inherit; font-size: 12px; cursor: pointer; }
  #jump.on { display: block; }
  /* Right-click on the output */
  #menu { display: none; position: absolute; z-index: 10; min-width: 120px; padding: 3px 0; border: 1px solid var(--edge);
          background: var(--ac-bg); color: var(--fg); font-size: 12px; }
  #menu.on { display: block; }
  #menu div { padding: 3px 12px; cursor: default; }
  #menu div:hover { background: var(--sel); }
  #out div { min-height: 1.35em; }
  #out .echo { color: var(--echo); }
  ::selection { background: var(--sel); }

  #ac { display: none; flex-direction: column; max-height: 45%; background: var(--ac-bg); border-top: 1px solid var(--edge); }
  #ac.on { display: flex; }
  #ac-head { color: var(--dim); font-size: 11px; padding: 3px 10px; border-bottom: 1px solid var(--edge); }
  #ac-list { overflow-y: auto; }
  #ac-list > div { display: flex; padding: 1px 10px 1px 22px; cursor: default; }
  #ac-list > div.sel { background: var(--ac-sel); }
  #ac-list .v { white-space: pre; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  #ac-list .n { color: var(--dim); white-space: pre; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; padding-left: 14px; }
  #ac-list .k { color: var(--dim); font-size: 11px; padding-left: 10px; flex: 0 0 auto; }
  #ac-list mark { background: none; color: var(--mark); }
  #ac-list .n.val { font-style: italic; }   /* a variable's value: shown, never inserted */
  #ac-list .sig { color: var(--dim); white-space: pre; flex: 0 0 auto; }   /* [params] -> returns */
  #ac-list > div.missing .v, #ac-list > div.missing .sig { opacity: 0.45; text-decoration: line-through; }
  #ac-list > div.missing .k { color: #ebcb8b; }
  #ac-desc { display: none; color: var(--fg); font-size: 12px; padding: 3px 10px; border-top: 1px solid var(--edge); }
  #ac-desc.on { display: block; }
  #ac-desc .warn { color: #ebcb8b; }
  #hint { display: none; padding: 2px 10px; border-top: 1px solid var(--edge); background: var(--ac-bg); color: var(--dim);
    font-size: 12px; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  #hint.on { display: block; }
  #hint b { color: var(--mark); font-weight: normal; text-decoration: underline; }
  #hint .ret, #hint .about { color: var(--dim); }

  #find { display: none; align-items: center; gap: 4px; padding: 3px 10px; border-top: 1px solid var(--edge); background: var(--ac-bg); }
  #find.on { display: flex; }
  #find input { flex: 0 1 320px; min-width: 120px; border: 1px solid var(--edge); outline: 0; background: rgba(0, 0, 0, 0.4);
    color: var(--fg); font: inherit; padding: 1px 6px; }
  #find input.bad { border-color: #e06c75; }
  #find button { border: 1px solid transparent; background: none; color: var(--dim); font: inherit; font-size: 12px;
    padding: 0 6px; cursor: default; }
  #find button.on { color: var(--fg); border-color: var(--edge); background: rgba(136, 192, 208, 0.18); }
  #find-count { color: var(--dim); font-size: 12px; min-width: 70px; padding-left: 4px; }
  #find-count.none { color: #e06c75; }
  mark.find { background: rgba(235, 203, 139, 0.28); color: inherit; }
  mark.find.cur { background: rgba(235, 203, 139, 0.75); color: #11141a; }
  #out .msg { color: #e06c75; }

  #bar { display: flex; align-items: center; border-top: 1px solid var(--edge); background: var(--input-bg); }
  #bar > span { color: var(--echo); padding: 0 6px 0 10px; }
  #inwrap { flex: 1; position: relative; display: flex; min-width: 0; }
  #in, #mirror { font: inherit; line-height: 18px; padding: 5px 10px 5px 0; }
  #in {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; position: relative;
    color: transparent; caret-color: var(--fg); /* the mirror under it draws the text */
  }
  #in::selection { color: transparent; background: var(--sel); }
  #mirror {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0; color: var(--fg);
    white-space: pre; overflow: hidden; pointer-events: none;
  }
  /* brackets: the pair touching the caret, the pair around it, unmatched */
  #mirror .br-at { color: #11141a; background: #e5c07b; border-radius: 2px; }
  #mirror .br-in { color: #11141a; background: #61afef; border-radius: 2px; }
  #mirror .br-bad { color: #e06c75; text-decoration: underline; }
  /* the input line's words: command, relay target, object or variable, ${ }, string, unknown, suggestion */
  #mirror .tk-cmd { color: #c678dd; }
  #mirror .tk-target { color: #d19a66; }
  #mirror .tk-obj { color: #61afef; }
  #mirror .tk-ds { color: #56b6c2; }
  #mirror .tk-str { color: #98c379; }
  #mirror .tk-bad { color: #e06c75; text-decoration-line: underline; text-decoration-style: wavy; text-decoration-color: #e06c75; }
  #mirror .ghost { color: var(--dim); }
  #out .time { color: var(--dim); }
  /* LavishScript colour codes: \a + letter */
  .c-r { color: #e06c75; } .c-g { color: #98c379; } .c-y { color: #e5c07b; } .c-o { color: #d19a66; }
  .c-u { color: #61afef; } .c-t { color: #56b6c2; } .c-p, .c-m { color: #c678dd; } .c-w { color: #ffffff; }
  .c-b { color: #5c6370; }
</style>
</head>
<body>
<div id="root">
  <div id="outwrap"><div id="out"></div><button id="jump"></button></div>
  <div id="menu"><div data-act="copy">Copy</div><div data-act="all">Copy all</div></div>
  <div id="find">
    <input id="find-q" spellcheck="false" autocomplete="off" placeholder="find">
    <button id="find-case" title="Match case (Alt+C)">Aa</button>
    <button id="find-re" title="Regular expression (Alt+R)">.*</button>
    <button id="find-word" title="Whole word (Alt+W)"><u>ab</u></button>
    <button id="find-filter" title="Show only matching lines (Alt+F)">filter</button>
    <span id="find-count"></span>
    <button id="find-up" title="Older match (Enter)">&#8593;</button>
    <button id="find-down" title="Newer match (Shift+Enter)">&#8595;</button>
    <button id="find-close" title="Close (Esc)">&#215;</button>
  </div>
  <div id="ac"><div id="ac-head"></div><div id="ac-list"></div><div id="ac-desc"></div></div>
  <div id="hint"></div>
  <div id="bar"><span>&gt;</span><div id="inwrap"><div id="mirror"></div><input id="in" spellcheck="false" autocomplete="off"></div></div>
</div>
<script>
(function () {
  var out = document.getElementById('out');
  var input = document.getElementById('in');
  var acBox = document.getElementById('ac');
  var acHead = document.getElementById('ac-head');
  var acList = document.getElementById('ac-list');
  var acDesc = document.getElementById('ac-desc');
  var hintEl = document.getElementById('hint');
  var MAX_DOM = 5000;   // output lines kept in the page
  var HIST_MAX = 200;   // history matches listed
  var LIST_MAX = 100;   // other matches listed

  var history = [];     // oldest first, no duplicates; the host's, shared by every session (hist)
  var sessionHist = []; // oldest first, no duplicates: what this session ran since the extension loaded (Up/Down)
  var hpos = -1;        // Up/Down recall position in sessionHist when no list is shown
  var data = { types: [], tlos: [], events: [], commands: [], aliases: [], scripts: [], files: [], variables: [] };
  // The open list: entries {v: value, k: kind, n: note}, the range of the input it replaces,
  // what was typed there, and whether it's the history list.
  var ac = { on: false, suppressed: false, items: [], total: 0, sel: 0, from: 0, to: 0, token: '', tokens: [], history: false, title: '' };

  function send(m) { if (window.lsc2Send) lsc2Send(JSON.stringify(m)); }

  // A key's name. Ultralight builds key events from raw Windows messages and leaves e.key
  // 'Unidentified' for some keys (Esc among them), so fall back to the key code.
  var KEY_NAMES = { 8: 'Backspace', 9: 'Tab', 13: 'Enter', 27: 'Escape', 33: 'PageUp', 34: 'PageDown', 35: 'End',
    36: 'Home', 37: 'ArrowLeft', 38: 'ArrowUp', 39: 'ArrowRight', 40: 'ArrowDown', 45: 'Insert', 46: 'Delete' };
  function keyName(e) {
    if (e.key && e.key !== 'Unidentified') return e.key;
    if (KEY_NAMES[e.keyCode]) return KEY_NAMES[e.keyCode];
    if (e.keyCode >= 65 && e.keyCode <= 90) return String.fromCharCode(e.keyCode).toLowerCase();
    return e.key || '';
  }

  // ------------------------------------------------------------------------------------------
  // Output
  // ------------------------------------------------------------------------------------------
  function atBottom() { return out.scrollHeight - out.scrollTop - out.clientHeight < 4; }

  // A console line as coloured runs [{s, c}] and its plain text. \x01 marks our own echo
  // (\x01HH:MM:SS\x01command, the time it was entered; older lines have no time);
  // \x07 + letter is a colour code (\x07x / \x07- resets, \x07-<letter> is the dark variant, shown
  // here as the same colour).
  function parseLine(text) {
    if (text.charAt(0) === '\x01') {
      var t = /^\x01(\d\d:\d\d:\d\d)\x01/.exec(text), e = '> ' + text.slice(t ? t[0].length : 1);
      if (!t) return { cls: 'echo', runs: [{ s: e, c: '' }], plain: e };
      return { cls: 'echo', runs: [{ s: t[1] + ' ', c: 'time' }, { s: e, c: '' }], plain: t[1] + ' ' + e };
    }
    if (text.charAt(0) === '\x02') { var g = text.slice(1); return { cls: 'msg', runs: [{ s: g, c: '' }], plain: g }; }
    var runs = [], cls = '', buf = '', plain = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ch === '\x07' && i + 1 < text.length) {
        if (buf) { runs.push({ s: buf, c: cls }); plain += buf; buf = ''; }
        var code = text.charAt(++i);
        if (code === '-' && i + 1 < text.length) code = text.charAt(++i);
        cls = (code === 'x' || code === '-') ? '' : 'c-' + code.toLowerCase();
        continue;
      }
      buf += ch;
    }
    if (buf) { runs.push({ s: buf, c: cls }); plain += buf; }
    return { cls: '', runs: runs, plain: plain };
  }

  // (Re)fill a line's element: its runs, with the search ranges [[start, end], ...] (on the plain
  // text) marked, range `cur` as the current match.
  function fillLine(d, ranges, cur) {
    var p = d._p, pos = 0, ri = 0;
    d.textContent = '';
    for (var r = 0; r < p.runs.length; r++) {
      var s = p.runs[r].s, c = p.runs[r].c, i = 0;
      while (i < s.length) {
        var abs = pos + i;
        while (ranges && ri < ranges.length && ranges[ri][1] <= abs) ri++;
        var inside = ranges && ri < ranges.length && ranges[ri][0] <= abs;
        var end = s.length;
        if (ranges && ri < ranges.length) end = Math.min(s.length, (inside ? ranges[ri][1] : ranges[ri][0]) - pos);
        var el = document.createElement(inside ? 'mark' : 'span');
        el.className = (c ? c + ' ' : '') + (inside ? (ri === cur ? 'find cur' : 'find') : '');
        el.textContent = s.slice(i, end);
        d.appendChild(el);
        i = end;
      }
      pos += s.length;
    }
    if (d._count > 1) { var rep = document.createElement('span'); rep.className = 'rep'; rep.textContent = '\u00d7' + d._count; d.appendChild(rep); }
    d._marked = !!(ranges && ranges.length);
  }

  function lineEl(text) {
    var d = document.createElement('div');
    d._raw = text;
    d._count = 1;
    d._p = parseLine(text);
    if (d._p.cls) d.className = d._p.cls;
    fillLine(d, find.on ? find.match(d._p.plain) : null, -1);
    return d;
  }

  // A line identical to the one before it (colour codes and all) isn't added again: the earlier
  // one counts it, shown as "×N" (the user, 2026-10-27).
  // Scrolled up, what you're reading stays where it is (the user, 2026-10-27): the first line in view
  // is noted before lines are added or the oldest trimmed, and put back at the same height after.
  // While scrolled up, the oldest lines are only trimmed past twice the usual limit, so the ones
  // being read aren't taken away; following the newest, the usual limit applies.
  function firstLineInView() {
    var top = out.scrollTop;
    for (var d = out.firstChild; d; d = d.nextSibling)
      if (d.offsetHeight && d.offsetTop + d.offsetHeight > top) return d; // hidden (filtered) lines have no height
    return null;
  }
  function addLines(lines) {
    var stick = atBottom();
    var anchor = stick ? null : firstLineInView(), anchorAt = anchor ? anchor.offsetTop - out.scrollTop : 0;
    var frag = document.createDocumentFragment(), prev = out.lastChild;
    for (var i = 0; i < lines.length; i++) {
      if (prev && prev._raw === lines[i]) {
        prev._count++;
        fillLine(prev, find.on ? find.match(prev._p.plain) : null, -1);
        continue;
      }
      prev = lineEl(lines[i]);
      frag.appendChild(prev);
    }
    out.appendChild(frag);
    var keep = stick ? MAX_DOM : MAX_DOM * 2;
    while (out.childNodes.length > keep) out.removeChild(out.firstChild);
    if (find.on) findSoon();
    if (stick) out.scrollTop = out.scrollHeight;
    else {
      // The line that was first in view, back at the same height; if it was trimmed away, the oldest left.
      out.scrollTop = anchor && anchor.parentNode === out ? anchor.offsetTop - anchorAt : 0;
      unseen += lines.length;
      showJump();
    }
  }

  // Scrolled up: "Back to current" (with how many lines arrived since) jumps to the newest line
  // (the user, 2026-10-27). Gone again at the bottom.
  var jump = document.getElementById('jump'), unseen = 0;
  function showJump() {
    if (atBottom()) { unseen = 0; jump.classList.remove('on'); return; }
    jump.textContent = '\u2193 ' + (unseen ? unseen + (unseen === 1 ? ' new line \u00b7 ' : ' new lines \u00b7 ') : '') + 'Back to current';
    jump.classList.add('on');
  }
  out.addEventListener('scroll', showJump);
  jump.addEventListener('mousedown', function (e) { e.preventDefault(); }); // keep the focus where it is
  jump.addEventListener('click', function () { out.scrollTop = out.scrollHeight; showJump(); });

  // A line of the console's own (a rejected paste, ...): red, page only.
  function note(text) { addLines(['\x02' + text]); out.scrollTop = out.scrollHeight; }

  // ------------------------------------------------------------------------------------------
  // Find (ctrl+F) over the output
  // ------------------------------------------------------------------------------------------
  var findBar = document.getElementById('find'), findQ = document.getElementById('find-q');
  var findCount = document.getElementById('find-count');
  var find = { on: false, cs: false, re: false, word: false, filter: false, list: [], cur: -1, match: null, timer: 0 };

  // A matcher for the current query: plain text -> [[start, end], ...] or null. Invalid regex: none.
  function buildMatcher() {
    var q = findQ.value;
    findQ.classList.remove('bad');
    if (!q) return null;
    var src = find.re ? q : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (find.word) src = '\\b(?:' + src + ')\\b';
    var rx;
    try { rx = new RegExp(src, find.cs ? 'g' : 'gi'); } catch (e) { findQ.classList.add('bad'); return null; }
    return function (plain) {
      var ranges = [], m;
      rx.lastIndex = 0;
      while ((m = rx.exec(plain))) {
        if (m[0].length === 0) { rx.lastIndex++; continue; }
        ranges.push([m.index, m.index + m[0].length]);
      }
      return ranges.length ? ranges : null;
    };
  }

  // Search every line again. keepPlace: stay on the same match (as near as possible).
  function runFind(keepPlace) {
    var prev = keepPlace && find.cur >= 0 ? find.list[find.cur] : null;
    find.match = find.on ? buildMatcher() : null;
    find.list = [];
    var lines = out.children;
    for (var i = 0; i < lines.length; i++) {
      var d = lines[i], ranges = find.match ? find.match(d._p.plain) : null;
      if (ranges) for (var k = 0; k < ranges.length; k++) find.list.push({ d: d, k: k });
      if (ranges || d._marked) fillLine(d, ranges, -1);
      d.style.display = find.on && find.filter && find.match && !ranges ? 'none' : '';
    }
    find.cur = find.list.length - 1; // newest
    if (prev) for (var j = 0; j < find.list.length; j++)
      if (find.list[j].d === prev.d && find.list[j].k === prev.k) { find.cur = j; break; }
    showCurrent(!keepPlace);
  }

  var findTimer = 0;
  function findSoon() { if (!findTimer) findTimer = setTimeout(function () { findTimer = 0; runFind(true); }, 100); }

  function showCurrent(scroll) {
    var n = find.list.length;
    findCount.textContent = !findQ.value ? '' : n ? (find.cur + 1) + ' / ' + n : 'no results';
    findCount.classList.toggle('none', !!findQ.value && !n);
    if (find.cur < 0 || find.cur >= n) return;
    var at = find.list[find.cur];
    fillLine(at.d, find.match(at.d._p.plain), at.k);
    if (scroll) {
      var top = at.d.offsetTop - out.offsetTop;
      if (top < out.scrollTop || top + at.d.offsetHeight > out.scrollTop + out.clientHeight)
        out.scrollTop = Math.max(0, top - out.clientHeight / 2);
    }
  }

  // delta -1: older (up), +1: newer (down); wraps.
  function stepFind(delta) {
    var n = find.list.length;
    if (!n) return;
    var old = find.list[find.cur];
    if (old) fillLine(old.d, find.match(old.d._p.plain), -1);
    find.cur = (find.cur + delta + n) % n;
    showCurrent(true);
  }

  function openFind() {
    var sel = String(window.getSelection() || '');
    if (sel && sel.indexOf('\n') < 0) findQ.value = sel;
    find.on = true;
    findBar.classList.add('on');
    findQ.focus();
    findQ.select();
    runFind(false);
  }

  function closeFind() {
    find.on = false;
    findBar.classList.remove('on');
    runFind(false); // clears marks and the filter
    findCount.textContent = '';
    input.focus();
  }

  function toggle(name, btn) {
    find[name] = !find[name];
    btn.classList.toggle('on', find[name]);
    runFind(true);
    findQ.focus();
  }
  var btnCase = document.getElementById('find-case'), btnRe = document.getElementById('find-re');
  var btnWord = document.getElementById('find-word'), btnFilter = document.getElementById('find-filter');
  btnCase.addEventListener('click', function () { toggle('cs', btnCase); });
  btnRe.addEventListener('click', function () { toggle('re', btnRe); });
  btnWord.addEventListener('click', function () { toggle('word', btnWord); });
  btnFilter.addEventListener('click', function () { toggle('filter', btnFilter); });
  document.getElementById('find-up').addEventListener('click', function () { stepFind(-1); findQ.focus(); });
  document.getElementById('find-down').addEventListener('click', function () { stepFind(1); findQ.focus(); });
  document.getElementById('find-close').addEventListener('click', closeFind);
  findBar.addEventListener('mousedown', function (e) { if (e.target !== findQ) e.preventDefault(); }); // buttons keep focus
  findQ.addEventListener('input', function () { runFind(false); });
  findQ.addEventListener('keydown', function (e) {
    var key = keyName(e);
    if (key === 'Enter') { stepFind(e.shiftKey ? 1 : -1); e.preventDefault(); }
    else if (key === 'Escape') { closeFind(); e.preventDefault(); }
    else if (e.altKey && key === 'c') { toggle('cs', btnCase); e.preventDefault(); }
    else if (e.altKey && key === 'r') { toggle('re', btnRe); e.preventDefault(); }
    else if (e.altKey && key === 'w') { toggle('word', btnWord); e.preventDefault(); }
    else if (e.altKey && key === 'f') { toggle('filter', btnFilter); e.preventDefault(); }
  });

  // ------------------------------------------------------------------------------------------
  // What to complete
  // ------------------------------------------------------------------------------------------

  // Where "the beginning" is: 0 (after leading spaces), or past `relay <where> `.
  function beginningAt(text) {
    var m = /^\s*relay\s+("[^"]*"|\S+)\s+/i.exec(text);

    if ((m = CHAIN_SEP.exec(head))) return memberContext(m[1], m[2], m[3], text.length - m[3].length);
    if ((m = /^(\S+)$/.exec(head))) {

  // The names matching the token, best first (the user's order, 2026-10-26):
  //   0 starts with it, same case    1 starts with it, any case

    var caret = input.selectionStart == null ? full.length : input.selectionStart;
    var text = full.slice(0, caret);

    var items = [], total = 0;
    if (ctx.history) {
      for (var i = history.length - 1; i >= 0; i--) {

        total++;

      ac.history = true; ac.title = 'history'; ac.tokens = ctx.history; ac.token = ''; ac.to = full.length;
    } else {
      var found = filterNames(ctx);

      total = found.length;

      // A selected placeholder is replaced by what's accepted.

  function renderAc() {

      var n = document.createElement('span');

  // The highlighted entry's description, under the list.
  function renderDesc() {
    var it = ac.items[ac.sel], text = '';
    if (it) {

      if (it.doc && it.doc.deprecated) text += (text ? '  ' : '') + 'Deprecated: ' + it.doc.deprecated;
    }

    if (it && it.missing) {
      var w = document.createElement('span');

    if (!ac.items.length) return;
    ac.sel = Math.max(0, Math.min(ac.items.length - 1, ac.sel + delta));
    var rows = acList.children;
    for (var i = 0; i < rows.length; i++)

    var r = rows[ac.sel];

  // ------------------------------------------------------------------------------------------
  // Placeholders (the user's spec): accepting an entry with parameters inserts the whole call, a

    input.value = full.slice(0, ac.from) + insert + full.slice(ac.to);

  // ------------------------------------------------------------------------------------------
  // The parameter hint, above the input line
  // ------------------------------------------------------------------------------------------
  function updateHint() {
    var full = input.value, caret = input.selectionStart == null ? full.length : input.selectionStart;
    var c = full ? callAt(full.slice(0, caret)) : null;
    hintEl.textContent = '';
    if (!c || !c.doc || !c.form) { hintEl.classList.remove('on'); return; }
    var ps = c.form.params || [], call = c.call !== 'command';
    hintEl.appendChild(document.createTextNode(c.name + (call ? '[' : ' ')));
    for (var i = 0; i < ps.length; i++) {

      var label = paramLabel(ps[i], !call);

      else hintEl.appendChild(document.createTextNode(label));

      var r = document.createElement('span'); r.className = 'ret'; r.textContent = ' → ' + c.form.returns; hintEl.appendChild(r);
    }

      (c.param.description ? ': ' + c.param.description : '')) : (c.form.description || c.doc.description || '');
    if (about) { var a = document.createElement('span'); a.className = 'about'; a.textContent = '    ' + about; hintEl.appendChild(a); }

  acList.addEventListener('mousedown', function (e) { e.preventDefault(); }); // keep the input focused
  acList.addEventListener('click', function (e) {
    var row = e.target.closest ? e.target.closest('#ac-list > div') : null;

  // ------------------------------------------------------------------------------------------
  // Messages in

      else if (m.t === 'focusInput') input.focus();
      else if (m.t === 'paste') pasted(m.text);
      else if (m.t === 'history') { history = (m.items || []).slice(); hpos = -1; if (ac.on) updateAc(); }
      else if (m.t === 'sessionHistory') { sessionHist = (m.items || []).slice(); hpos = -1; }

        typeInfo[m.name] = { type: m.type || '', members: m.members || [], methods: m.methods || [], live: m.live !== false,

      }
      else if (m.t === 'forgetValues') { memberValues = {}; valuesAsked = {}; if (ac.on) updateAc(); }
      else if (m.t === 'scopeVars') {

  // ------------------------------------------------------------------------------------------
  // Brackets on the input line (the user, 2026-10-26)
  // ------------------------------------------------------------------------------------------
  // Typing ( [ or { adds its closer after the caret when the caret is at the end, before a space or
  // before another closer; with a selection, it wraps the selection instead. Typing a closer that is
  // already next steps over it when the line is balanced. Backspace between an empty pair removes
  // both. Tab steps over the next closer. Only typing does this: pasting, completion and history
  // set the line as they are.
  // Highlighting, brackets only: the pair touching the caret (the bracket just before it, else the
  // one just after) in yellow, the innermost pair around the caret in blue, unmatched ones in red.

      }

  // What one edit should become: b = {v, s, e} before it, v and s after it, ph whether parameter
  // placeholders are active. Returns {v, s, e} to apply, or null to leave the edit alone.
  function bracketEdit(b, v, s, ph) {

        v.slice(0, b.s) === b.v.slice(0, b.s) && v.slice(s) === b.v.slice(b.e)) {
      var c = v.charAt(b.s);

      }
      if (OPEN[c]) {

    if (!removed && s === b.s - 1 && v === b.v.slice(0, s) + b.v.slice(b.s) && OPEN[b.v.charAt(s)] &&

        break;

  function afterTyping() {

  // ------------------------------------------------------------------------------------------
  // The input line's colours and the suggestion from history (the user, 2026-10-27)
  // ------------------------------------------------------------------------------------------
  // Colours: the command (red when no command or alias starts like that -- LavishScript takes
  // abbreviations), a relay's target, ${ and its }, the object or variable a chain starts with, each
  // member or method after it that the type is known not to have (red), and strings. The word at the
  // caret is never red: it's still being typed. Nothing is red until the lists have arrived.

    for (i = 0; i < data.aliases.length; i++) if (String(data.aliases[i].n).toLowerCase() === l) return true;
    return false;

    for (i = 0; i < data.tlos.length; i++) if (String(data.tlos[i]).toLowerCase() === l) return true;
    for (i = 0; i < data.types.length; i++) if (String(data.types[i]).toLowerCase() === l) return true; // type-named objects
    for (i = 0; i < vs.length; i++) if (String(vs[i].v).toLowerCase() === l) return true;
    return false;
  }
  function hasName(list, name) {
    var l = name.toLowerCase();
    for (var i = 0; i < list.length; i++) if (String(list[i]).toLowerCase() === l) return true;
    return false;
  }

  // One class per character ('' for none).
  function lineClasses(v, caret) {
    var cls = [], i;
    for (i = 0; i < v.length; i++) cls.push('');
    function mark(a, b, c) { for (var k = a; k < b && k < v.length; k++) cls[k] = c; }
    function typing(a, b) { return caret >= a && caret <= b; }
    var lists = data.commands.length > 0, objects = data.tlos.length > 0;

    // A chain starting at `at`: Name[args].Name:Name ... -- colours what it can check.
    function chain(at) {
      var m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(v.slice(at));
      if (!m) return;
      var rootOk = knownRoot(m[0]);
      mark(at, at + m[0].length, rootOk || typing(at, at + m[0].length) || !objects ? 'tk-obj' : 'tk-bad');
      if (!rootOk) return;
      var pos = at + m[0].length, info = chainInfo(m[0], true);
      for (;;) {
        if (v.charAt(pos) === '[') { // arguments: skip to the matching ]
          var depth = 0, j = pos;
          for (; j < v.length; j++) { var c = v.charAt(j); if (c === '[') depth++; else if (c === ']' && --depth === 0) break; }
          if (j >= v.length) return;
          pos = j + 1;
          info = chainInfo(v.slice(at, pos), true);
        }
        var sep = v.charAt(pos);
        if (sep !== '.' && sep !== ':') return;
        var n = /^[A-Za-z_][A-Za-z0-9_]*/.exec(v.slice(pos + 1));
        if (!n) return;
        var a = pos + 1, b = a + n[0].length;
        if (!info || !info.live) return; // can't check this one, nor anything after it
        var ok = hasName(sep === '.' ? info.members : info.methods, n[0]);
        if (!ok && !typing(a, b)) { mark(a, b, 'tk-bad'); return; }
        if (!ok || sep === ':') return; // a method ends what can be followed
        pos = b;
        info = chainInfo(v.slice(at, pos), true);
      }
    }

    // relay <target>, then the command (or a chain) at the beginning.
    var b0 = beginningAt(v);
    if (b0 > 0) {
      var rm = /^(\s*)(\S+)(\s+)("[^"]*"|\S+)/.exec(v);
      if (rm) {
        var r0 = rm[1].length, t0 = r0 + rm[2].length + rm[3].length;
        mark(r0, r0 + rm[2].length, 'tk-cmd');
        mark(t0, t0 + rm[4].length, 'tk-target');
      }
    }
    var fw = /^\S+/.exec(v.slice(b0));
    if (fw && fw[0].charAt(0) !== '$' && fw[0].charAt(0) !== '"') {
      if (/[.:\[]/.test(fw[0])) chain(b0);
      else mark(b0, b0 + fw[0].length, knownCommand(fw[0]) || typing(b0, b0 + fw[0].length) || !lists ? 'tk-cmd' : 'tk-bad');
    }

    // Strings, then ${...} on top (a data sequence inside a string is still evaluated).
    for (i = 0; i < v.length; i++) {
      if (v.charAt(i) !== '"') continue;
      var e = v.indexOf('"', i + 1);
      if (e < 0) e = v.length - 1;
      mark(i, e + 1, 'tk-str');
      i = e;
    }
    var pairs = bracketPairs(v);
    for (i = 0; i + 1 < v.length; i++) {
      if (v.charAt(i) !== '$' || v.charAt(i + 1) !== '{') continue;
      mark(i, i + 2, 'tk-ds');
      if (pairs[i + 1] >= 0) cls[pairs[i + 1]] = 'tk-ds';
      var close = pairs[i + 1] >= 0 ? pairs[i + 1] : v.length; // inside ${...}: not the string's colour
      for (var k = i + 2; k < close; k++) if (cls[k] === 'tk-str') cls[k] = '';
      chain(i + 2);
    }
    return cls;
  }

  // The suggestion: with the caret at the end of the line, the newest command that starts with what's
  // typed -- this session's first, then everyone's -- greyed after the caret. Right arrow or End takes
  // it.
  function suggestion(v) {
    if (!v.trim() || historyQuery(v)) return '';
    var lists = [sessionHist, history];
    for (var l = 0; l < lists.length; l++)
      for (var i = lists[l].length - 1; i >= 0; i--) {
        var h = String(lists[l][i]);
        if (h.length > v.length && h.indexOf(v) === 0) return h.slice(v.length);
      }
    return '';
  }
  function ghostNow() {
    var v = input.value, s = input.selectionStart;
    if (ph || document.activeElement !== input || s !== input.selectionEnd || s !== v.length) return '';
    return suggestion(v);
  }

  // The input's text is drawn by a mirror under it (the input's own text is transparent), so
  // single characters can be coloured. Redrawn only when the text, caret or scroll changed, or the
  // lists the colours check against did (`painted` is cleared when they arrive).
  var mirror = document.getElementById('mirror'), painted = '';
  function paintInput() {
    var v = input.value, s = input.selectionStart, e = input.selectionEnd, ghost = ghostNow();
    var key = v + '\x00' + s + ',' + e + ',' + input.scrollLeft + '\x00' + ghost;
    if (key !== painted) {
      painted = key;
      var marks = bracketMarks(v, s, e), cls = lineClasses(v, s), frag = document.createDocumentFragment();
      for (var i = 0; i < v.length; ) { // runs of one class; brackets' marks win
        var c = marks[i] ? 'br-' + marks[i] : cls[i], j = i + 1;
        while (j < v.length && !marks[j] && !marks[i] && cls[j] === c) j++;
        if (c) { var sp = document.createElement('span'); sp.className = c; sp.textContent = v.slice(i, j); frag.appendChild(sp); }
        else frag.appendChild(document.createTextNode(v.slice(i, j)));
        i = j;
      }
      if (ghost) { var g = document.createElement('span'); g.className = 'ghost'; g.textContent = ghost; frag.appendChild(g); }
      mirror.textContent = '';
      mirror.appendChild(frag);
    }
    mirror.scrollLeft = input.scrollLeft;
  }
  // Completion, history, placeholders and paste set the line in many places: while the input has
  // focus, a cheap check catches them (nothing is redrawn unless something changed).
  var paintTimer = 0;
  function paintTick() { paintInput(); remember(); } // also keeps `before` current for typing that comes without a keydown
  input.addEventListener('focus', function () { paintTick(); if (!paintTimer) paintTimer = setInterval(paintTick, 50); });
  input.addEventListener('blur', function () { clearInterval(paintTimer); paintTimer = 0; paintInput(); });
  input.addEventListener('keyup', paintInput);
  input.addEventListener('mouseup', paintTick);
  input.addEventListener('scroll', paintInput);

  // ------------------------------------------------------------------------------------------
  // Input line
  // ------------------------------------------------------------------------------------------
  // Up/Down recall (the user, 2026-10-27): only this session's commands since the extension loaded,
  // newest first, stopping at the oldest; `hist` still searches everyone's. A repeated command moves
  // to the newest end, as in the shared history. The extension keeps the same list and resends it
  // on "ready", so a page reload or host restart doesn't lose it.
  function sessionAdd(list, text) {
    var at = list.indexOf(text);
    if (at >= 0) list.splice(at, 1);
    list.push(text);
    if (list.length > 1000) list.shift(); // the extension's kSessionHistMax
  }
  // One step from position `pos` (-1: not recalling): {pos, value}, or null when there's nothing to do.
  function recallStep(list, pos, dir) {
    if (dir < 0) {
      if (!list.length) return null;
      var p = pos < 0 ? list.length - 1 : Math.max(0, pos - 1);
      return { pos: p, value: list[p] };
    }
    if (pos < 0) return null;
    return pos + 1 >= list.length ? { pos: -1, value: '' } : { pos: pos + 1, value: list[pos + 1] };
  }

  function run() {
    ph = null;
    var text = input.value.trim();
    if (text) {
      send({ t: 'exec', text: text }); // the host records it and sends histAdd to every console
      sessionAdd(sessionHist, text);
    }
    input.value = ''; hpos = -1; ac.suppressed = false; hideAc(); updateHint();
    out.scrollTop = out.scrollHeight;
  }

  input.addEventListener('focus', function () { send({ t: 'focus' }); });
  input.addEventListener('input', function () { afterTyping(); hpos = -1; phSync(); updateAc(); paintInput(); remember(); });
  input.addEventListener('keyup', function (e) { var k = keyName(e); if (/^(Arrow|Home|End)/.test(k)) updateHint(); });
  input.addEventListener('mouseup', updateHint);

  input.addEventListener('keydown', function (e) {
    remember(); // what the line was before this key, for afterTyping
    var key = keyName(e);
    if ((key === 'ArrowRight' || key === 'End') && !e.shiftKey && !e.ctrlKey) {
      var ghost = ghostNow();
      if (ghost) {
        input.value += ghost;
        input.setSelectionRange(input.value.length, input.value.length);
        hpos = -1; updateAc(); paintInput(); e.preventDefault(); return;
      }
    }
    if (ph && key === 'Escape') { phEscape(); hideAc(); updateHint(); e.preventDefault(); return; }
    if (ph && key === 'Tab' && (!ac.on || e.shiftKey)) { phSelect(e.shiftKey ? -1 : 1); hideAc(); e.preventDefault(); return; }
    if (ac.on) {
      if (key === 'ArrowUp') { moveSel(-1); e.preventDefault(); return; }
      if (key === 'ArrowDown') { moveSel(1); e.preventDefault(); return; }
      if (key === 'PageUp') { moveSel(-10); e.preventDefault(); return; }
      if (key === 'PageDown') { moveSel(10); e.preventDefault(); return; }
      if (key === 'Tab') {
        var cur = ac.items[ac.sel];
        if (!ac.history && cur && String(cur.v).toLowerCase() === ac.token.toLowerCase() && stepOut()) { e.preventDefault(); return; }
        acceptAc(ac.sel); e.preventDefault(); return;
      }
      if (key === 'Escape') { ac.suppressed = true; hideAc(); e.preventDefault(); return; }
      if (key === 'Enter' && e.altKey) { e.preventDefault(); return; } // already showing
      if (key === 'Enter') {
        var it = ac.items[ac.sel];
        // Already typed in full: run it rather than "complete" it to itself.
        if (!ac.history && it && String(it.v).toLowerCase() === ac.token.toLowerCase()) { run(); e.preventDefault(); return; }
        acceptAc(ac.sel); e.preventDefault(); return;
      }
    }
    if (key === 'Tab') { stepOut(); e.preventDefault(); return; } // never leave the input line
    if (key === 'Enter' && e.altKey) {
      ac.suppressed = false; updateAc(); e.preventDefault();
    } else if (key === 'Enter') {
      run(); e.preventDefault();
    } else if (key === 'Escape') {
      input.value = ''; hpos = -1; updateAc(); e.preventDefault();
    } else if (key === 'ArrowUp' || key === 'ArrowDown') {
      var step = recallStep(sessionHist, hpos, key === 'ArrowUp' ? -1 : 1);
      if (step) { hpos = step.pos; input.value = step.value; e.preventDefault(); }
    }
  });

  // ------------------------------------------------------------------------------------------
  // Keyboard anywhere in the console
  // ------------------------------------------------------------------------------------------
  // The text box with focus (the input line or the find box), or null.
  function focusedBox() {
    var a = document.activeElement;
    return a && a.tagName === 'INPUT' ? a : null;
  }
  function boxSelection(box) {
    return box && box.selectionStart !== box.selectionEnd ? box.value.slice(box.selectionStart, box.selectionEnd) : '';
  }
  function edited(box) { if (box === input) updateAc(); else runFind(false); }

  // Paste: the host reads the clipboard and sends it back ('paste'). One line goes in at the
  // caret of the box that asked; more than one is refused (the user, 2026-10-26).
  var pasteInto = null;
  function pasted(text) {
    var box = pasteInto || input;
    pasteInto = null;
    text = String(text || '').replace(/[\r\n]+$/, '');
    if (/[\r\n]/.test(text)) {
      note('Paste refused: ' + text.split(/\r\n|\r|\n/).length + ' lines. Paste one line at a time.');
      return;
    }
    box.focus();
    box.setRangeText(text, box.selectionStart, box.selectionEnd, 'end');
    edited(box);
  }

  // ctrl+C copies what's selected (in the box with focus first, else in the output); ctrl+X does
  // the same and removes it from the box; ctrl+V / Shift+Insert paste; ctrl+F opens find.
  document.addEventListener('keydown', function (e) {
    var key = keyName(e), box = focusedBox();
    // Typing after clicking the output goes to the input line (the character follows the focus).
    if (!e.ctrlKey && !e.altKey && !e.metaKey && key.length === 1 && !box) {
      input.focus();
      return;
    }
    if (e.shiftKey && !e.ctrlKey && key === 'Insert') { pasteInto = box || input; send({ t: 'paste' }); e.preventDefault(); return; }
    if (!e.ctrlKey || e.altKey || e.metaKey) return;
    var k = key.toLowerCase();
    if (k === 'f') { openFind(); e.preventDefault(); return; }
    if (k === 'v') { pasteInto = box || input; send({ t: 'paste' }); e.preventDefault(); return; }
    if (k !== 'c' && k !== 'x') return;
    var fromBox = boxSelection(box);
    var text = fromBox || String(window.getSelection() || '');
    if (text) send({ t: 'copy', text: text });
    if (k === 'x' && fromBox) { box.setRangeText('', box.selectionStart, box.selectionEnd, 'start'); edited(box); }
    e.preventDefault();
  }, true);

  // Right-click on the output: Copy (when something is selected) and Copy all (the user,
  // 2026-10-27). Copy all is every line the console holds, repeated lines written out each time,
  // without colour codes.
  var menu = document.getElementById('menu'), menuSel = '';
  function hideMenu() { menu.classList.remove('on'); }
  function allText() {
    var lines = [];
    for (var d = out.firstChild; d; d = d.nextSibling)
      for (var n = 0; n < (d._count || 1); n++) lines.push(d._p ? d._p.plain : d.textContent);
    return lines.join('\n');
  }
  // Opened on the right button's release: the page's renderer doesn't send `contextmenu`.
  out.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  out.addEventListener('mousedown', function (e) { if (e.button === 2) e.preventDefault(); }); // keep the selection
  out.addEventListener('mouseup', function (e) {
    if (e.button !== 2) return;
    e.preventDefault();
    menuSel = String(window.getSelection() || '');
    menu.querySelector('[data-act="copy"]').style.display = menuSel ? '' : 'none';
    menu.classList.add('on');
    var root = document.getElementById('root').getBoundingClientRect();
    var x = Math.min(e.clientX, root.right - menu.offsetWidth - 4), y = Math.min(e.clientY, root.bottom - menu.offsetHeight - 4);
    menu.style.left = Math.max(0, x - root.left) + 'px';
    menu.style.top = Math.max(0, y - root.top) + 'px';
  });
  menu.addEventListener('mousedown', function (e) { e.preventDefault(); }); // keep the selection
  menu.addEventListener('click', function (e) {
    var act = e.target.getAttribute && e.target.getAttribute('data-act');
    if (act === 'copy' && menuSel) send({ t: 'copy', text: menuSel });
    if (act === 'all') send({ t: 'copy', text: allText() });
    hideMenu();
  });
  document.addEventListener('mousedown', function (e) { if (!menu.contains(e.target)) hideMenu(); }, true);
  document.addEventListener('keydown', function (e) { if (keyName(e) === 'Escape') hideMenu(); }, true);
  out.addEventListener('scroll', hideMenu);

  send({ t: 'ready' });
})();
</script>
</body>
</html>
